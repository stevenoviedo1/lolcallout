# Fallback if not using Dockerfile — still avoid electron by filtering workspaces
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install --include=dev -w @riftcoach/shared -w @riftcoach/prompts -w @riftcoach/api --include-workspace-root --no-audit --no-fund"
]

[phases.build]
cmds = [
  "npm run build -w @riftcoach/shared",
  "npm run build -w @riftcoach/prompts",
  "npm run build -w @riftcoach/api"
]

[start]
cmd = "npm run start -w @riftcoach/api"
