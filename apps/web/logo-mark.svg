<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LOLCallout">
  <defs>
    <linearGradient id="hp" x1="96" y1="80" x2="416" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F5C542"/>
    </linearGradient>
    <linearGradient id="bars" x1="200" y1="140" x2="312" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05070F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Perfect circle mark (Google / favicon safe) -->
  <circle cx="256" cy="256" r="256" fill="#080B12"/>
  <circle cx="256" cy="256" r="248" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#1E293B" stroke-width="4"/>
  <!-- Headphones band -->
  <path d="M150 248c0-72 48-120 106-120s106 48 106 120" fill="none" stroke="url(#hp)" stroke-width="22" stroke-linecap="round"/>
  <!-- Ear cups -->
  <rect x="118" y="228" width="52" height="88" rx="22" fill="none" stroke="url(#hp)" stroke-width="18"/>
  <rect x="342" y="228" width="52" height="88" rx="22" fill="none" stroke="url(#hp)" stroke-width="18"/>
  <!-- Equalizer bars -->
  <rect x="198" y="220" width="18" height="90" rx="9" fill="url(#bars)"/>
  <rect x="228" y="190" width="18" height="120" rx="9" fill="url(#bars)"/>
  <rect x="258" y="170" width="18" height="140" rx="9" fill="url(#bars)"/>
  <rect x="288" y="200" width="18" height="110" rx="9" fill="url(#bars)"/>
  <!-- Accent slash -->
  <line x1="330" y1="150" x2="380" y2="200" stroke="#F5C542" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
</svg>
